conky.config = {
  own_window = true, own_window_type = 'desktop', own_window_argb_visual = true,
  own_window_argb_value = 175, own_window_colour = '0f1724',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  alignment = 'top_right', gap_x = 24, gap_y = 46,
  minimum_width = 320, maximum_width = 320, border_inner_margin = 16,
  use_xft = true, font = 'JetBrains Mono:size=9',
  default_color = 'c9d6e8', color1 = '5b8ff0', color2 = '38bdd6', color3 = '9b82f0',
  color4 = '3fbf8a', color5 = 'e05563', color6 = '8a97aa',
  update_interval = 2, double_buffer = true, draw_shades = false, draw_borders = false,
  draw_graph_borders = false, net_avg_samples = 2, top_name_width = 18,
}
conky.text = [[
${color1}${font JetBrains Mono:bold:size=10}SYSTEM${font}${alignr}${color6}${nodename} · ${kernel}
${color2}cpu${alignr}${color}${cpu cpu0}%
${color1}${cpubar cpu0 4,}
${color2}mem${alignr}${color}${mem} / ${memmax}
${color2}${membar 4,}
${color2}disk /${alignr}${color}${fs_used} / ${fs_size /}
${color3}${fs_bar 4 /}

${color1}${font JetBrains Mono:bold:size=10}NETWORK${font}
${execpi 10 ~/.local/bin/frostbyte-net info}
${color2}↓ ${color}${downspeed @IF@}${goto 175}${color3}↑ ${color}${upspeed @IF@}
${color1}${downspeedgraph @IF@ 26,150 5b8ff0 38bdd6 -l}${goto 175}${upspeedgraph @IF@ 26,150 9b82f0 e05563 -l}
${color2}сессия${alignr}${color}↓ ${totaldown @IF@}  ↑ ${totalup @IF@}

${color1}${font JetBrains Mono:bold:size=10}IP${font}
${color2}real ip${alignr}${color}${execi 300 ~/.local/bin/frostbyte-net real}
${color2}exit ip${alignr}${color4}${execi 120 ~/.local/bin/frostbyte-net exit}

${color1}${font JetBrains Mono:bold:size=10}TUNNELS${font}
${execpi 10 ~/.local/bin/frostbyte-net tunnels}

${color1}${font JetBrains Mono:bold:size=10}LOAD${font}
${color2}load avg${alignr}${color}${loadavg 1}  ${loadavg 2}  ${loadavg 3}
${color2}uptime${alignr}${color}${uptime_short}
${color6}process${goto 200}cpu%${goto 260}mem%
${color}${top name 1}${goto 200}${top cpu 1}${goto 260}${top mem 1}
${color}${top name 2}${goto 200}${top cpu 2}${goto 260}${top mem 2}
${color}${top name 3}${goto 200}${top cpu 3}${goto 260}${top mem 3}
]]
